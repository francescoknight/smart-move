name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/SmartMove.Tests
      - run: dotnet publish src/SmartMove.App -c Release -r win-x64 --self-contained false -o dist
      - run: g++ -O2 -std=c++17 -shared -static -static-libgcc -static-libstdc++ -o dist/SmartMoveShell.dll shell/SmartMoveShell.cpp shell/SmartMoveShell.def -lole32 -lshell32 -lshlwapi -luuid -Wl,--kill-at
        shell: bash
      - run: cp install.bat install_drop.bat uninstall.bat uninstall_drop.bat update.bat update.ps1 dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: SmartMove, path: dist }

      - name: Zip per il download
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath SmartMove.zip

      # ---- prova reale su Windows ----
      - name: Selftest motore (stesso volume e tra volumi diversi)
        shell: pwsh
        run: |
          $cwd = (Resolve-Path dist).Path
          $d = if (Test-Path D:\) { "D:\" } else { "C:\" }
          New-Item -ItemType Directory -Force "${d}sm_src","C:\sm_dst" | Out-Null
          $p = Start-Process "$cwd\SmartMove.exe" -ArgumentList "--selftest","${d}sm_src","C:\sm_dst" -Wait -PassThru
          Get-Content "$cwd\selftest.log"
          if ($p.ExitCode -ne 0) { throw "selftest fallito ($($p.ExitCode))" }
      - name: Installazione (regsvr32 + chiavi di registro)
        shell: pwsh
        run: |
          $cwd = (Resolve-Path dist).Path
          Copy-Item dist C:\SmartMoveInst -Recurse
          cmd /c "C:\SmartMoveInst\install.bat nostart" 2>&1 | Write-Host
          $clsid = '{5B7F2C1A-8E34-4D6B-9A52-3C1D0E7F4A19}'
          foreach ($k in "HKCU:\Software\Classes\CLSID\$clsid\InprocServer32",
                         "HKCU:\Software\Classes\Directory\shellex\DragDropHandlers\SmartMove",
                         "HKCU:\Software\Classes\Drive\shellex\DragDropHandlers\SmartMove",
                         "HKCU:\Software\Classes\Directory\Background\shell\SmartMovePaste\command",
                         "HKCU:\Software\Classes\Directory\shell\SmartMoveDupes\command",
                         "HKCU:\Software\Classes\Directory\Background\shell\SmartMoveDupes\command",
                         "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run") {
            if (-not (Test-Path $k)) { throw "chiave mancante: $k" } else { "OK $k" }
          }
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SmartMove) { throw "Run key mancante" }
      - name: Caricamento DLL via COM (handler menu e drop handler)
        shell: pwsh
        run: |
          cmd /c "regsvr32 /s /n /i:drop C:\SmartMoveInst\SmartMoveShell.dll"
          foreach ($c in '{5B7F2C1A-8E34-4D6B-9A52-3C1D0E7F4A19}','{5B7F2C1A-8E34-4D6B-9A52-3C1D0E7F4A1A}') {
            $t = [type]::GetTypeFromCLSID([guid]$c)
            $o = [Activator]::CreateInstance($t)
            "creato $c : $($o -ne $null)"
          }
          if (-not (Test-Path "HKCU:\Software\Classes\Directory\shellex\DropHandler")) { throw "DropHandler non registrato" }
      - name: Pubblica release 'latest'
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest SmartMove.zip update.bat update.ps1 --title "Ultima versione" --notes "Versione automatica del commit ${{ github.sha }}. Per aggiornare usa update.bat."
      - name: Prova aggiornamento automatico (update.bat sull'installazione)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env: { SMARTMOVE_CI: "1" }
        run: |
          Copy-Item update.bat C:\SmartMoveInst\update.bat -Force
          cmd /c "C:\SmartMoveInst\update.bat" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "update.bat fallito" }
          if (-not (Test-Path C:\SmartMoveInst\SmartMove.exe)) { throw "exe mancante dopo update" }
          if (-not (Test-Path HKCU:\Software\Classes\Directory\shellex\DragDropHandlers\SmartMove)) { throw "registrazione persa dopo update" }
      - name: Disinstallazione
        shell: pwsh
        run: |
          cmd /c "C:\SmartMoveInst\uninstall.bat nostart" 2>&1 | Write-Host
          foreach ($k in "HKCU:\Software\Classes\Directory\shellex\DragDropHandlers\SmartMove","HKCU:\Software\Classes\Directory\shellex\DropHandler","HKCU:\Software\Classes\Directory\shell\SmartMoveDupes","HKCU:\Software\Classes\Directory\Background\shell\SmartMoveDupes") {
            if (Test-Path $k) { throw "chiave ancora presente: $k" } else { "rimossa $k" }
          }
